# Standalone docker-compose untuk ocr-engine
# Gunakan: docker-compose -f ocr-engine/docker-compose.yml up
# Atau dari root: docker-compose -f ocr-engine/docker-compose.yml up

version: '3.8'

services:
  ocr-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-engine-img
    container_name: ocr-engine
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL}
      - TESSERACT_PATH=/usr/bin/tesseract
      - OCR_LANGUAGE=${OCR_LANGUAGE}
      - OCR_TIMEOUT=${OCR_TIMEOUT}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  ocr-network:
    driver: bridge
